[package]
name = "streampipe"
description = "StreamPipe desktop app (Windows, Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["github-updates"]
# GitHub builds check releases on launch; Microsoft Store / Flatpak builds turn this off.
github-updates = []

[dependencies]
streampipe-core = { path = "../core" }
streampipe-ui = { path = "../ui" }
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "default_fonts", "system_fonts", "wayland", "x11"] }
libmpv2 = "7"
libmpv2-sys = "4"
rfd = "0.18"
open = "5"
parking_lot = "0.12"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
wry = "0.57"
tao = "0.37"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
