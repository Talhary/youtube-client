[package]
name = "streampipe-android"
description = "StreamPipe core for the Android app, exposed through JNI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "streampipe"
crate-type = ["cdylib"]

[dependencies]
streampipe-core = { path = "../../core" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
libc = "0.2"
